<nb-layout [class.auth-layout]="!auth.isAuthenticated()">
  <nb-layout-header *ngIf="auth.isAuthenticated()" fixed>
    <div class="header-bar">
      <button class="brand" type="button" (click)="goToHome()">
        <img src="assets/images/logo_task.png" alt="TaskTrack" class="logo_task">
      </button>

      <nb-user
        [name]="auth.currentUser()?.name || 'Usuário'"
        [title]="getRoleName(auth.currentUser()?.role)"
        [nbContextMenu]="contextMenuItems"
        nbContextMenuTag="user-context-menu">
      </nb-user>
    </div>
  </nb-layout-header>

  <nb-sidebar *ngIf="auth.isAuthenticated()" state="expanded" compactedBreakpoint="xl" collapsedBreakpoint="md">
    <nb-menu [items]="menu"></nb-menu>
  </nb-sidebar>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

  <nb-layout-footer *ngIf="auth.isAuthenticated()" fixed>
    <span>Desenvolvido por <a href="https://www.linkedin.com/in/ramou1/" target="_blank" rel="noopener">Ramon Oliveira</a>.</span>
  </nb-layout-footer>
</nb-layout>

<ng-template #profileDialog let-ref="dialogRef">
  <nb-card class="profile-dialog">
    <nb-card-header>Meu perfil</nb-card-header>
    <nb-card-body>
      <p><strong>Nome:</strong> {{ auth.currentUser()?.name }}</p>
      <p><strong>E-mail:</strong> {{ auth.currentUser()?.email }}</p>
      <p><strong>Nível:</strong> {{ getRoleName(auth.currentUser()?.role) }}</p>
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="basic" type="button" (click)="ref.close()">Fechar</button>
      <button nbButton status="danger" type="button" (click)="ref.close(); logout()">Sair</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
